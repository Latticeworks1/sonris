<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SONRIS blocked serial check</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: #ddd; }
  h2 { color: #aef; }
  #status { color: #fa0; margin-bottom: 12px; }

<body>

<div id="status">Initialising…</div>
<div id="results"></div>
<button id="copy" style="display:none" onclick="copyResults()">Copy results</button>

<script src="https://js.puter.com/v2/"></script>

const DOC_SEARCH   = 'https://sonlite.dnr.state.la.us/ords/r/sonris_pub/document_access/finddocuments';
const DOC_RESULTS  = 'https://sonlite.dnr.state.la.us/ords/r/sonris_pub/document_access/findalldocumentsresults';

const lines = {};
function render() {
    const el = document.getElementById('results');
    el.innerHTML = SERIALS.map(s => {
        const v = lines[s];
        if (!v) return `<span style="color:#555">${s}: pending</span>`;
        const cls = v === 'yes' ? 'yes' : v === 'no' ? 'no' : 'err';
        return `<span class="${cls}">${s}: ${v}</span>`;
    }).join('\n');
}

async function checkSerial(serial) {
    const r = await puter.net.fetch(
        `${DOC_SEARCH}?idx=xwellserialnumber&val=${serial}`,
        {redirect: 'follow'}
    );
    const html = await r.text();

    // finddocuments either embeds results or links to findalldocumentsresults
    const piM = html.match(/findalldocumentsresults\/?(\d+)/);
    let body = html;
    if (piM) {
        const r2 = await puter.net.fetch(
            `${DOC_RESULTS}/${piM[1]}`,
            {redirect: 'follow'}
        );
        body = await r2.text();
    }
    // also check if the redirect landed on findalldocumentsresults
    if (r.url && r.url.includes('findalldocumentsresults') && body === html) {
        // body already contains the results page
    }
    return /WELL\s*LOG/i.test(body) ? 'yes' : 'no';
}

function copyResults() {
    const text = SERIALS.filter(s => lines[s] === 'yes').join('\n');
    navigator.clipboard.writeText(text);
    document.getElementById('copy').textContent = 'Copied!';
}

async function main() {
    document.getElementById('status').textContent = `Checking ${SERIALS.length} serials…`;

    for (const serial of SERIALS) {
        try {
            lines[serial] = await checkSerial(serial);
        } catch(e) {
            lines[serial] = `error: ${e.message || e}`;
        }
        render();
        await new Promise(r => setTimeout(r, 600));
    }

    const withLogs = SERIALS.filter(s => lines[s] === 'yes');
    document.getElementById('status').textContent =
        `Done. ${withLogs.length} of ${SERIALS.length} have logs.`;
    document.getElementById('copy').style.display = 'inline';
}

main();
</script>
</body>
</html>
